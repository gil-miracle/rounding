<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>컨퍼런스 이벤트</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ================= 상단 네비게이션 / 진행 표시 ================= -->
  <header class="topbar" id="topbar" hidden>
    <button class="navbtn" id="btnPrev" type="button">
      <span class="navbtn__arrow" aria-hidden="true">‹</span><span id="btnPrevLabel">이전</span>
    </button>
    <button class="brand" id="btnBrand" type="button" title="처음으로">MIRACLE</button>
    <button class="navbtn" id="btnNext" type="button">
      <span id="btnNextLabel">다음</span><span class="navbtn__arrow" aria-hidden="true">›</span>
    </button>
  </header>

  <!-- ===================== 1. 인트로 ===================== -->
  <section class="screen" id="screen-intro" data-screen="intro">
    <button class="gear" id="btnStockOpen" type="button" aria-label="상품 수량 관리" title="상품 수량 관리">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M19.14 12.94a7.6 7.6 0 0 0 .05-.94 7.6 7.6 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.62l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.86a.5.5 0 0 0 .12.62l2.03 1.58c-.03.31-.05.63-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.62l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.62l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Z"/>
      </svg>
    </button>
    <div class="screen__body screen__body--center">
      <img class="intro__logo" id="introLogo" alt="" hidden>
      <p class="intro__eyebrow" id="introEyebrow"></p>
      <h1 class="intro__title" id="introTitle"></h1>
      <p class="intro__subtitle" id="introSubtitle"></p>
      <dl class="intro__meta" id="introMeta"></dl>
    </div>
    <div class="screen__footer">
      <button class="btn btn--primary" id="btnStart" type="button">시작하기</button>
    </div>
  </section>

  <!-- ===================== 2. 퀴즈 ===================== -->
  <section class="screen" id="screen-quiz" data-screen="quiz" hidden>
    <div class="screen__body">
      <p class="eyebrow" id="quizEyebrow">QUIZ</p>
      <h2 class="heading" id="quizQuestion"></h2>
      <ul class="choices" id="quizChoices"></ul>
      <div class="feedback" id="quizFeedback" role="status" aria-live="polite" hidden>
        <p class="feedback__title" id="quizFeedbackTitle"></p>
        <p class="feedback__desc" id="quizFeedbackDesc"></p>
      </div>
    </div>
    <div class="screen__footer">
      <button class="btn btn--primary" id="btnQuizNext" type="button" hidden>다음</button>
    </div>
  </section>

  <!-- ===================== 3. 상품 선택 ===================== -->
  <section class="screen" id="screen-prize" data-screen="prize" hidden>
    <div class="screen__body">
      <p class="eyebrow" id="prizeEyebrow">PRIZE</p>
      <h2 class="heading" id="prizeHeading"></h2>
      <p class="subheading" id="prizeSubheading"></p>
      <ul class="prizes" id="prizeList"></ul>
      <p class="notice" id="prizeSoldOut" hidden></p>
    </div>
    <div class="screen__footer">
      <button class="btn btn--primary" id="btnPrizeNext" type="button" disabled>선택 완료</button>
    </div>
  </section>

  <!-- ================= 4. 상품 공개 (짜잔!) ================= -->
  <section class="screen" id="screen-reveal" data-screen="reveal" hidden>
    <div class="screen__body screen__body--center">
      <div class="reveal" id="revealStage">
        <div class="reveal__burst" aria-hidden="true"></div>
        <span class="reveal__spark" style="--i:0" aria-hidden="true">✨</span>
        <span class="reveal__spark" style="--i:1" aria-hidden="true">🎉</span>
        <span class="reveal__spark" style="--i:2" aria-hidden="true">✨</span>
        <span class="reveal__spark" style="--i:3" aria-hidden="true">🎊</span>

        <p class="reveal__lead" id="revealLead"></p>
        <div class="reveal__card">
          <div class="reveal__photo" id="revealPhoto"></div>
          <p class="reveal__sub" id="revealSub"></p>
          <p class="reveal__name" id="revealName"></p>
          <p class="reveal__note" id="revealNote"></p>
        </div>
      </div>
    </div>
    <div class="screen__footer">
      <button class="btn btn--primary" id="btnRevealNext" type="button">다음</button>
    </div>
  </section>

  <!-- ===================== 5. 사다리타기 ===================== -->
  <section class="screen" id="screen-ladder" data-screen="ladder" hidden>
    <div class="screen__body">
      <div class="ladder__intro" id="ladderIntro">
        <p class="eyebrow" id="ladderEyebrow">LADDER</p>
        <h2 class="heading" id="ladderHeading"></h2>
        <p class="subheading" id="ladderSubheading"></p>
      </div>

      <div class="ladder" id="ladder">
        <div class="ladder__row ladder__heads" id="ladderHeads"></div>
        <div class="ladder__board" id="ladderBoard">
          <svg class="ladder__svg" id="ladderSvg" aria-hidden="true"></svg>
        </div>

        <!-- 아래 5칸 → 도착하면 하나로 합쳐지며 QR이 올라오는 영역 -->
        <div class="footarea" id="ladderFootArea">
          <div class="ladder__row ladder__feet" id="ladderFeet"></div>
          <div class="merge" id="ladderMerge" role="status" aria-live="polite" hidden>
            <p class="merge__lead" id="mergeLead"></p>
            <p class="merge__label" id="mergeLabel"></p>
            <div class="merge__qr" id="mergeQr"></div>
            <p class="merge__caption" id="mergeCaption"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="screen__footer">
      <button class="btn btn--primary" id="btnLadderStart" type="button" hidden>스타트</button>
      <button class="btn btn--primary" id="btnLadderNext" type="button" hidden>다음</button>
    </div>
  </section>

  <!-- ===================== 5. 엔딩 ===================== -->
  <section class="screen" id="screen-ending" data-screen="ending" hidden>
    <div class="screen__body screen__body--center">
      <p class="eyebrow">THANK YOU</p>
      <h2 class="heading" id="endingTitle"></h2>
      <p class="subheading" id="endingMessage"></p>

      <div class="ending__card" id="endingPrizeCard" hidden>
        <p class="ending__card-label" id="endingPrizeLabel"></p>
        <div class="ending__qr" id="endingPrizeQr"></div>
        <p class="ending__card-caption" id="endingPrizeCaption"></p>
      </div>

      <div class="ending__card" id="endingLinkCard" hidden>
        <p class="ending__card-label" id="endingLinkLabel"></p>
        <div class="ending__qr" id="endingLinkQr"></div>
        <p class="ending__card-caption" id="endingLinkCaption"></p>
      </div>
    </div>
    <div class="screen__footer">
      <button class="btn btn--ghost" id="btnRestart" type="button">처음으로</button>
      <p class="autoreset" id="autoReset" hidden></p>
    </div>
  </section>

  <!-- ================= 상품 수량 관리 (운영자용) ================= -->
  <div class="modal" id="stockModal" hidden>
    <div class="modal__backdrop" id="stockBackdrop"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="stockTitle">
      <h2 class="modal__title" id="stockTitle">상품 수량 관리</h2>
      <p class="modal__desc">남은 수량과 전체 수량을 바꿀 수 있어요. <strong>저장</strong>을 눌러야 반영됩니다.</p>
      <ul class="stocklist" id="stockList"></ul>
      <div class="modal__actions">
        <button class="btn btn--primary" id="btnStockSave" type="button">저장</button>
        <button class="btn btn--ghost" id="btnStockCancel" type="button">닫기</button>
      </div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/ladder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
